loomx.loom_version = "1.18-SNAPSHOT"


[mod]
id = "lootbeams"
name = "LootBeamsContinued"
group = "com.github.razorplay"
version = "1.0.0"
channel_tag = ""
description = "Renders highly configurable colored beams on dropped items!"
authors = ["RazorPlay01"]
contributors = ["EnsoX", "VanderCat", "Grend (aka AHilyard)", "IMS (aka IMS212)"]
inception_year = "2026"
license.name = "MIT"
license.url = "https://opensource.org/licenses/MIT"
license.dist = "repo"
sources_url = "null"
homepage_url = "null"
issues_url = "null/issues"
discord_url = ""
environment = "client_only"
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]
dev_jvm_args_mixin_debug = [
	"-Dmixin.env.remapRefMap=true",
	"-Dmixin.debug.verbose=true",
	"-Dmixin.debug.verify=true",
	"-Dmixin.debug.countInjections=true",
	"-Dmixin.debug=true",
	"-Dmixin.debug.export=true"
]
[[mod.pom.developers]]
id = "razorplay01"
name = "RazorPlay01"
url = "https://github.com/ghost"

